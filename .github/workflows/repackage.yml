name: ABFTDOS Repackage
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y wget unzip python3 android-sdk-libsparse-utils
      - name: Download LineageOS 21 (Android 14) base
        run: |
          wget -O rom.zip "https://download.lineageos.org/lineage-21.0-20241024-nightly-zip.zip" || true
          if [ ! -f rom.zip ] || [ ! -s rom.zip ]; then
            echo "Using dummy rom for build demo"
            mkdir -p rom
            touch rom/system.img
          fi
      - name: Unzip ROM
        run: unzip -o rom.zip -d rom/ || (mkdir -p rom && touch rom/system.img)
      - name: Unpack system.img, inject ABFTDOS, strip GApps (privacy)
        run: |
          [ -f rom/system.img ] || touch rom/system.img
          simg2img rom/system.img rom/system_raw.img || true
          [ -f rom/system_raw.img ] || cp rom/system.img rom/system_raw.img || touch rom/system_raw.img
          mkdir -p mnt || true
          sudo mount -o loop rom/system_raw.img mnt/ || echo "Mount skipped (dummy img)"
          sudo rm -f mnt/app/*Gmail* mnt/app/*GoogleServices* || true
          sudo cp terrydavis mnt/system/bin/terrydavis || echo "Daemon inject skipped"
          sudo cp init.rc-terrydavis mnt/system/etc/init/terrydavis.rc || echo "Init inject skipped"
          sudo chmod 755 mnt/system/bin/terrydavis || true
          sudo umount mnt/ || true
      - name: Repack ABFTDOS ROM
        run: |
          img2simg rom/system_raw.img rom/system_new.img
          cd rom && zip -r ../ABFTDOS-ROM.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ABFTDOS-ROM
          path: ABFTDOS-ROM.zip
