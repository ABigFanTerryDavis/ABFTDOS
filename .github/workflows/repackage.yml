name: ABFTDOS Repackage
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download LineageOS 21 (Android 14) base
        run: echo "Download pre-built ROM image"
      - name: Unpack system.img, inject ABFTDOS, strip GApps (privacy)
        run: echo "Strip GMS/Gmail/privacy apps, inject terrydavis daemon, keep Play Store + YouTube"
      - name: Repack ABFTDOS ROM
        run: echo "Repack and sign ROM zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ABFTDOS-ROM
          path: out/ABFTDOS-ROM.zip
